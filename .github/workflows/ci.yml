name: native-rust

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to build
        type: choice
        options: [windows, linux-and-macos]
        default: windows

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # raven-actions/actionlint v2
        with:
          version: 1.7.7
          shellcheck: false
          pyflakes: false
      - name: Check repository documentation and workflow policy
        run: python scripts/check_repository.py
      - name: Test repository checks
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check whitespace
        run: git diff --check

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install --profile minimal --component clippy --component rustfmt "$toolchain"
      - name: Cache Cargo state
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # actions/cache v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libfontconfig1-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            xinput \
            xvfb
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-features --no-fail-fast
      - name: Product tests
        run: cargo test --locked -p stemplayer
      - name: Preview packaging checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-preview.ps1
      - name: Unix packaging checks
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/test-unix-preview.ps1
      - name: Product release build
        run: cargo build --locked --release -p stemplayer
      - name: UI startup smoke
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo run --locked -p stemplayer --no-default-features --features development -- --ui-smoke 1000
          else
            cargo run --locked -p stemplayer --no-default-features --features development -- --ui-smoke 1000
          fi
      - name: Minimal feature check
        run: cargo check --locked --workspace --no-default-features
      - name: Full feature check
        run: cargo check --locked --workspace --all-features

  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install --profile minimal "$toolchain"
      - name: Cache dependency tool and Cargo state
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # actions/cache v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install cargo-deny when not cached
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install --locked cargo-deny --version 0.20.2
          fi
      - name: Enforce dependency policy
        run: cargo deny check

  package-windows-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.packages != 'linux-and-macos'
    needs: [workflow-integrity, quality, dependency-policy]
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $channel) { throw 'Missing pinned toolchain' }
          rustup toolchain install --profile minimal --target x86_64-pc-windows-msvc $channel
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
      - name: Install pinned release tools
        run: |
          cargo install --locked --debug cargo-about --version 0.9.2 --features cli --root artifacts/release-tools
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about installation failed' }
          cargo install --locked --debug cargo-cyclonedx --version 0.5.9 --root artifacts/release-tools
          if ($LASTEXITCODE -ne 0) { throw 'cargo-cyclonedx installation failed' }
      - name: Build unqualified unsigned preview
        run: ./scripts/package-windows-preview.ps1
      - name: Upload candidate ZIP and checksum only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: windows-preview-${{ github.sha }}
          path: |
            artifacts/windows-preview/*/stemplayer-native-*-windows-x86_64.zip
            artifacts/windows-preview/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  package-unix-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.packages == 'linux-and-macos'
    needs: [workflow-integrity, quality, dependency-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            slug: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          ref: f589012f48c8a340609e61a751001a28cdbd33b9
          path: artifacts/unix-source
          persist-credentials: false
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfontconfig1-dev libx11-xcb-dev libxcursor-dev \
            libxkbcommon-x11-dev libx11-dev libxrandr2 libxi6 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libdbus-1-3 xvfb xauth \
            xdg-desktop-portal xdg-desktop-portal-gtk
      - name: Install pinned Rust and release tools
        run: |
          $channel = (Select-String rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $channel) { throw 'Missing pinned Rust toolchain' }
          rustup toolchain install --profile minimal --target '${{ matrix.target }}' $channel
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          cargo install --locked --debug cargo-about --version 0.9.2 --features cli --root artifacts/release-tools
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about installation failed' }
          cargo install --locked --debug cargo-cyclonedx --version 0.5.9 --root artifacts/release-tools
          if ($LASTEXITCODE -ne 0) { throw 'cargo-cyclonedx installation failed' }
      - name: Build and check Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a pwsh -NoProfile -File scripts/package-unix-preview.ps1 -SourceDirectory artifacts/unix-source
      - name: Build and check macOS application archive
        if: runner.os == 'macOS'
        run: ./scripts/package-unix-preview.ps1 -SourceDirectory artifacts/unix-source
      - name: Upload Unix archive and its checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: unix-preview-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/unix-preview/${{ matrix.slug }}/0.1.0-preview.1/*
          if-no-files-found: error
          retention-days: 30
