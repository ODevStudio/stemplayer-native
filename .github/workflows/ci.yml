name: native-rust

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # raven-actions/actionlint v2
        with:
          version: 1.7.7
          shellcheck: false
          pyflakes: false
      - name: Check repository documentation and workflow policy
        run: python scripts/check_repository.py
      - name: Test repository checks and release tooling
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check whitespace
        run: git diff --check

  quality:
    needs: workflow-integrity
    strategy:
      fail-fast: false
      # Free-tier budget policy: PRs use one Linux runner; master/tags add Windows;
      # macOS is optional Phase 12 coverage and runs only by explicit dispatch.
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","windows-2025","macos-15"]' || '["ubuntu-24.04","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install --profile minimal --component clippy --component rustfmt "$toolchain"
      - name: Cache Cargo state
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # actions/cache v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Remap private build paths
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          flags = []
          for root, replacement in [(Path.home(), "/cargo-home"), (Path(os.environ["GITHUB_WORKSPACE"]), "/src")]:
              for spelling in sorted({str(root), root.as_posix()}):
                  flags.append(f"--remap-path-prefix={spelling}={replacement}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("CARGO_ENCODED_RUSTFLAGS=" + chr(31).join(flags) + "\n")
          PY
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libfontconfig1-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            xinput \
            xvfb
      - name: Install dependency-policy tool
        if: runner.os == 'Linux'
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install --locked cargo-deny --version 0.20.2
          fi
      - name: Enforce dependency policy
        if: runner.os == 'Linux'
        run: cargo deny check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Product tests
        run: cargo test --locked -p stemplayer
      - name: Product release build
        run: cargo build --locked --release -p stemplayer
      - name: Local-only native support smoke
        run: |
          mkdir -p artifacts/tmp
          support=target/release/stemplayer-support
          if [ "$RUNNER_OS" = "Windows" ]; then support="$support.exe"; fi
          "$support" --build-info --output artifacts/tmp/build-info.json
          "$support" --report --output artifacts/tmp/support-report.json
          "$support" --benchmark --iterations 2 --output artifacts/tmp/support-benchmark.json
      - name: Enforce unsigned Windows build evidence
        if: runner.os == 'Windows'
        run: |
          target="$(python -c 'import json; print(json.load(open("artifacts/tmp/build-info.json"))["target"])')"
          cargo metadata --locked --offline --format-version 1 \
            --manifest-path apps/stemplayer/Cargo.toml --filter-platform "$target" \
            > artifacts/tmp/release-cargo-metadata.json
          python scripts/release_evidence.py collect \
            --build-info artifacts/tmp/build-info.json \
            --metadata artifacts/tmp/release-cargo-metadata.json \
            --binary target/release/stemplayer.exe \
            --support-binary target/release/stemplayer-support.exe \
            --output artifacts/unsigned-build-evidence
          python scripts/release_evidence.py verify artifacts/unsigned-build-evidence
      - name: UI startup smoke
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo run --locked -p stemplayer --no-default-features --features development -- --ui-smoke 1000
          else
            cargo run --locked -p stemplayer --no-default-features --features development -- --ui-smoke 1000
          fi
      - name: Minimal feature check
        run: cargo check --locked --workspace --no-default-features
      - name: Full feature check
        run: cargo check --locked --workspace --all-features
