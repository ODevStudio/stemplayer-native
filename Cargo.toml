[workspace]
exclude = ["vendor/symphonia-codec-aac"]
members = [
    "apps/stemplayer",
    "apps/stemplayer-probe",
    "crates/stemplayer-decode",
    "crates/stemplayer-domain",
    "crates/stemplayer-engine",
    "crates/stemplayer-format",
    "crates/stemplayer-mixer",
    "crates/stemplayer-network",
    "crates/stemplayer-output",
    "crates/stemplayer-platform",
    "crates/stemplayer-timeline",
    "crates/stemplayer-ui",
    "crates/stemplayer-waveform",
    "phase0-probe",
    "tools/stemplayer-callback-audit",
]
default-members = [
    "apps/stemplayer",
    "apps/stemplayer-probe",
    "crates/stemplayer-decode",
    "crates/stemplayer-domain",
    "crates/stemplayer-engine",
    "crates/stemplayer-format",
    "crates/stemplayer-mixer",
    "crates/stemplayer-network",
    "crates/stemplayer-output",
    "crates/stemplayer-platform",
    "crates/stemplayer-timeline",
    "crates/stemplayer-ui",
    "crates/stemplayer-waveform",
]
resolver = "3"

[workspace.package]
version = "0.1.0-preview.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
cpal = { version = "=0.18.1", features = ["realtime"] }
fastrand = "=2.5.0"
rtrb = "=0.3.5"
rfd = { version = "=0.15.4", default-features = false }
rubato = "=4.0.0"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "=1.17.1"
stemplayer-decode = { path = "crates/stemplayer-decode" }
stemplayer-domain = { path = "crates/stemplayer-domain" }
stemplayer-engine = { path = "crates/stemplayer-engine" }
stemplayer-format = { path = "crates/stemplayer-format" }
stemplayer-mixer = { path = "crates/stemplayer-mixer" }
stemplayer-network = { path = "crates/stemplayer-network" }
stemplayer-output = { path = "crates/stemplayer-output" }
stemplayer-platform = { path = "crates/stemplayer-platform" }
stemplayer-timeline = { path = "crates/stemplayer-timeline" }
stemplayer-ui = { path = "crates/stemplayer-ui" }
symphonia = { version = "=0.6.0", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
stemplayer-waveform = { path = "crates/stemplayer-waveform" }
unicode-normalization = "=0.1.25"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"

[patch.crates-io]
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
