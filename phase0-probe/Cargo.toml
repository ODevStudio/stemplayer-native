[package]
name = "stemplayer-phase0-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cpal = "=0.18.1"
rtrb = "=0.3.4"
rubato = "=4.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit-x11", "renderer-software", "accessibility", "compat-1-2"] }
symphonia = { version = "=0.6.0", default-features = false, features = ["aac", "alac", "isomp4", "pcm", "wav"] }

[build-dependencies]
slint-build = "=1.17.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
