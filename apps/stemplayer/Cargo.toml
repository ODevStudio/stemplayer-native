[package]
name = "stemplayer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["product"]
product = [
    "local-wav",
    "local-mp4",
    "aac",
    "alac",
    "hls",
]
development = ["stemplayer-ui/development"]
local-wav = ["stemplayer-format/local-wav"]
local-mp4 = ["stemplayer-format/local-mp4"]
aac = ["stemplayer-decode/aac", "local-mp4"]
alac = ["stemplayer-decode/alac", "local-mp4"]
hls = ["stemplayer-network/hls"]

[dependencies]
fastrand.workspace = true
slint.workspace = true
serde_json.workspace = true
stemplayer-decode.workspace = true
stemplayer-domain.workspace = true
stemplayer-engine.workspace = true
stemplayer-format.workspace = true
stemplayer-network.workspace = true
stemplayer-output.workspace = true
stemplayer-platform.workspace = true
stemplayer-timeline.workspace = true
stemplayer-ui.workspace = true
stemplayer-waveform.workspace = true


[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { workspace = true, features = ["xdg-portal", "async-std"] }

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.11"

[lints]
workspace = true
